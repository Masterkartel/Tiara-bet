
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crash Game</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<nav class="nav">
  <div class="brand">Crash Game</div>
  <div class="nav-right">
    <span id="userName"></span>
    <span class="balance">KES <span id="balance">0.00</span></span>
    <a href="/wallet.html">Wallet</a>
    <button id="logoutBtn">Logout</button>
  </div>
</nav>

<main class="game-main">
  <div class="crash-panel">
    <div class="multiplier-display" id="multiplier">1.00x</div>
    <div class="status" id="status">Waiting for next round...</div>
    <div class="countdown" id="countdown"></div>
  </div>

  <div class="bet-panel">
    <label>Bet Amount (KES)</label>
    <input type="number" id="betAmount" min="10" value="10" />
    <div class="quick-bets">
      <button data-amt="10">10</button>
      <button data-amt="50">50</button>
      <button data-amt="100">100</button>
      <button data-amt="500">500</button>
    </div>
    <button id="betBtn" class="btn-primary">Place Bet</button>
    <button id="cashBtn" class="btn-cash" disabled>Cash Out</button>
    <p class="msg" id="betMsg"></p>
  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
